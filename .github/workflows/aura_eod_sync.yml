name: AURA SSI EOD to private R2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = safe check only; refresh = sync and publish EOD'
        required: true
        default: verify
        type: choice
        options:
          - verify
          - refresh
  schedule:
    - cron: '17 11 * * 1-5' # 18:17 Vietnam time (UTC+7); non-guaranteed start

permissions:
  contents: read

concurrency:
  group: aura-eod-r2
  cancel-in-progress: false

jobs:
  refresh:
    # Manual verify is safe even before enabling automatic daily sync.
    # Both scheduled and manual refresh require the explicit safety switch.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify') || vars.AURA_EOD_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SSI_CLIENT_ID: ${{ secrets.SSI_CLIENT_ID }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
      AURA_R2_ENDPOINT: ${{ secrets.AURA_R2_ENDPOINT }}
      AURA_R2_BUCKET: ${{ secrets.AURA_R2_BUCKET }}
      AURA_R2_ACCESS_KEY_ID: ${{ secrets.AURA_R2_ACCESS_KEY_ID }}
      AURA_R2_SECRET_ACCESS_KEY: ${{ secrets.AURA_R2_SECRET_ACCESS_KEY }}
      AURA_R2_PREFIX: aura-eod
      AURA_WORKFLOW_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all required secrets are present (never print values)
        shell: bash
        run: |
          python - <<'PY'
          import os
          required = ['AURA_R2_ENDPOINT','AURA_R2_BUCKET',
                      'AURA_R2_ACCESS_KEY_ID','AURA_R2_SECRET_ACCESS_KEY']
          if os.getenv('GITHUB_EVENT_NAME') == 'schedule' or os.getenv('AURA_WORKFLOW_MODE') == 'refresh':
              required.extend(('SSI_CLIENT_ID','SSI_API_KEY','SSI_API_SECRET'))
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit('Missing GitHub Actions secrets: ' + ', '.join(missing))
          print('[PRECHECK] Secrets present (values hidden)')
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore private R2 snapshot
        run: python scripts/aura_fullmarket_snapshot.py restore
      - name: Verify restored full-market snapshot
        run: python scripts/aura_eod_quality_gate.py verify
      - name: Refresh SSI equity catalogue
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'refresh' }}
        run: python scripts/ssi_sync_universe.py
      - name: Refresh stale SSI daily candles (no trading actions)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'refresh' }}
        run: python scripts/aura_fullmarket_snapshot.py sync --mode stale --limit 2000 --pause 1.5 --days 950
      - name: Require new EOD and safe data coverage
        id: gate
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'refresh' }}
        run: python scripts/aura_eod_quality_gate.py publish
      - name: Publish validated private R2 snapshot
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: python scripts/aura_fullmarket_snapshot.py upload
      - name: Verify published remote R2 snapshot
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: python scripts/aura_eod_quality_gate.py verify
