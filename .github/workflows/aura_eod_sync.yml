name: AURA SSI EOD to private R2
on:
  workflow_dispatch:
  schedule:
    - cron: '47 10 * * 1-5' # 17:47 Vietnam time; GitHub cron may be delayed
permissions:
  contents: read
concurrency:
  group: aura-eod-r2
  cancel-in-progress: false
jobs:
  refresh:
    # Disabled until owner confirms SSI rights and configures secrets + variable.
    if: ${{ vars.AURA_EOD_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SSI_CLIENT_ID: ${{ secrets.SSI_CLIENT_ID }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
      AURA_R2_ENDPOINT: ${{ secrets.AURA_R2_ENDPOINT }}
      AURA_R2_BUCKET: ${{ secrets.AURA_R2_BUCKET }}
      AURA_R2_ACCESS_KEY_ID: ${{ secrets.AURA_R2_ACCESS_KEY_ID }}
      AURA_R2_SECRET_ACCESS_KEY: ${{ secrets.AURA_R2_SECRET_ACCESS_KEY }}
      AURA_R2_PREFIX: aura-eod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact project dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore previous market snapshot from private R2
        run: python scripts/aura_fullmarket_snapshot.py restore
      - name: Refresh authoritative SSI universe
        run: python scripts/ssi_sync_universe.py
      - name: Refresh EOD across all equities, with resume ledger
        run: python scripts/aura_fullmarket_snapshot.py sync --mode stale --limit 2000 --pause 1.5 --days 950
      - name: Publish new validated snapshot to private R2
        run: python scripts/aura_fullmarket_snapshot.py upload
